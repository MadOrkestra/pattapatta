# Minimal npm trusted-publishing workflow (docs-shaped).
# https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
#
# Configure Trusted Publisher on npmjs.com to THIS file:
#   Organization or user: MadOrkestra   (case-sensitive!)
#   Repository:           pattapatta
#   Workflow filename:    publish.yml
#   Environment name:     (leave EMPTY — this job has no environment:)
#   Allowed actions:      npm publish  ← must be checked
#
# Then: Actions → Publish Package → Run workflow

name: Publish Package

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # setup-node writes empty _authToken which blocks OIDC (npm/documentation#1960)
      - name: Prepare npmrc for OIDC
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "npmrc=${npmrc}"
          if [ -f "${npmrc}" ]; then
            echo "--- before ---"
            cat "${npmrc}"
            sed -i '/_authToken/d' "${npmrc}"
            echo "--- after ---"
            cat "${npmrc}"
          fi
          echo "node=$(node --version) npm=$(npm --version)"
          echo "oidc_url_set=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"

      - name: Probe npm OIDC token exchange
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          # Request a GitHub OIDC JWT for npm's audience
          ID_JSON="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H "Accept: application/json; api-version=2.0" \
            -H "Content-Type: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          ID_TOKEN="$(printf '%s' "${ID_JSON}" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).value))")"
          # Exchange with the registry (print status + error body, never the token)
          HTTP="$(curl -sS -o /tmp/oidc-exchange.json -w '%{http_code}' \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/pattapatta" \
            -H "Content-Type: application/json" \
            -d "$(node -e "console.log(JSON.stringify({token:process.argv[1]}))" "${ID_TOKEN}")")"
          echo "OIDC exchange HTTP ${HTTP}"
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('/tmp/oidc-exchange.json','utf8'));
            delete j.token; delete j.access_token; delete j.refresh_token;
            console.log(JSON.stringify(j,null,2));
          "
          if [ "${HTTP}" != "200" ]; then
            echo "::error::OIDC exchange failed. Trusted Publisher on npmjs.com does not match this workflow (org case, repo, publish.yml, empty environment, allow npm publish)."
            exit 1
          fi

      - run: npm publish --access public

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${NAME}@${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/${TAG}" --force
          NOTES="$(awk -v ver="## ${VERSION}" '
            $0 == ver {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md)"
          [ -n "${NOTES// }" ] || NOTES="Release ${TAG}"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" || \
            gh release edit "$TAG" --notes "$NOTES"
