name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GitHub-hosted runner required for npm trusted publishing (OIDC).
    # https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing: Node ≥ 22.14, npm ≥ 11.5.1
          node-version: 24
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
          # Prove OIDC request vars are present for this job
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # Invoke npm publish directly — do NOT use `pnpm release`.
          # pnpm's script runner strips ACTIONS_ID_TOKEN_* and OIDC fails
          # with ENEEDAUTH (npm docs: OIDC only for `npm publish`).
          publish: npm publish --access public
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
