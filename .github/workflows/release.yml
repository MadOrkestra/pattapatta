name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GitHub-hosted runner required for npm trusted publishing (OIDC).
    # https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing: Node ≥ 22.14, npm ≥ 11.5.1
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          # Avoid caching release builds (npm docs recommendation)
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Clear dummy token auth so npm uses OIDC
        run: |
          # setup-node may write _authToken=${NODE_AUTH_TOKEN} and export a
          # placeholder; strip tokens so publish relies on OIDC exchange.
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          for f in "$HOME/.npmrc" .npmrc "$NPM_CONFIG_USERCONFIG"; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            sed -i '/_authToken/d' "$f" || true
            sed -i '/^always-auth/d' "$f" || true
          done

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # Must call npm publish (not pnpm publish) for OIDC.
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Leave NPM_TOKEN / NODE_AUTH_TOKEN unset for OIDC.
