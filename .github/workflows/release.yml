name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GitHub-hosted runner required for npm trusted publishing (OIDC).
    # https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history/tags + token so we can push release tags
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing: Node ≥ 22.14, npm ≥ 11.5.1
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # Opens/updates the Version Packages PR when .changeset/* exists.
      # Do not publish from this action — it does not forward OIDC env.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish when there is no pending changeset (version already on main).
      # Use != 'true' so a missing/empty output still attempts publish.
      - name: Publish to npm (OIDC)
        id: publish
        if: steps.changesets.outputs.has-changesets != 'true'
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${NAME}@${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${TAG} already on npm — skip publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Drop dummy //registry…:_authToken from setup-node so OIDC can run.
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            [ -n "${f}" ] && [ -f "${f}" ] || continue
            sed -i '/_authToken/d' "${f}" || true
          done

          echo "Publishing ${TAG} via OIDC"
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/${TAG}" --force

          # Notes: section for this version from CHANGELOG.md
          NOTES="$(awk -v ver="## ${VERSION}" '
            $0 == ver {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md)"
          if [ -z "${NOTES// }" ]; then
            NOTES="Release ${TAG}"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES"
