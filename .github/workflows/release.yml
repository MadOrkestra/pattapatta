name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# https://docs.npmjs.com/trusted-publishers
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Do NOT set registry-url here.
      # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # which makes npm skip OIDC and fail with ENEEDAUTH when the token is empty.
      # https://github.com/npm/documentation/issues/1960
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Use npm with trusted-publishing support
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Create Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm via OIDC
        id: publish
        if: steps.changesets.outputs.has-changesets != 'true'
        run: |
          set -euo pipefail

          # Prove GitHub issued an OIDC token for this job
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${NAME}@${VERSION}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${TAG} already on npm — skip"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure no classic-token auth is configured (blocks OIDC)
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npm config delete "//registry.npmjs.org/:_authToken" >/dev/null 2>&1 || true
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
            echo "--- ${NPM_CONFIG_USERCONFIG} ---"
            cat "${NPM_CONFIG_USERCONFIG}" || true
          fi
          if [ -f "$HOME/.npmrc" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc"
          fi
          if [ -f .npmrc ]; then
            sed -i '/_authToken/d' .npmrc
          fi

          npm config set registry https://registry.npmjs.org/
          echo "Publishing ${TAG}"
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/${TAG}" --force

          NOTES="$(awk -v ver="## ${VERSION}" '
            $0 == ver {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md)"
          if [ -z "${NOTES// }" ]; then
            NOTES="Release ${TAG}"
          fi

          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
