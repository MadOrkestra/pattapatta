# npm trusted publishing (OIDC)
# Docs: https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
#
# On npmjs.com → pattapatta → Settings → Trusted Publisher:
#   Organization or user: MadOrkestra
#   Repository:           pattapatta
#   Workflow filename:    release.yml
#   Allowed actions:      include "npm publish" (not stage-only)
#
# Note: setup-node + registry-url writes an empty _authToken that prevents
# OIDC (ENEEDAUTH / E404). Strip it before publish — see npm/documentation#1960.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Create Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${NAME}@${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.changesets.outputs.has-changesets }}" = "true" ]; then
            echo "Pending changesets — Version Packages PR only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${TAG} already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Will publish ${TAG}"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      # Same shape as npm docs example:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Required workaround: empty _authToken blocks OIDC → E404/ENEEDAUTH
      # https://github.com/npm/documentation/issues/1960
      - name: Strip empty _authToken so OIDC can run
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "Using npmrc: ${npmrc}"
          if [ -f "${npmrc}" ]; then
            echo "--- before ---"
            cat "${npmrc}"
            sed -i '/_authToken/d' "${npmrc}"
            echo "--- after ---"
            cat "${npmrc}"
          else
            echo "No npmrc at ${npmrc}"
          fi
          node --version
          npm --version

      - run: npm publish --access public

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/${TAG}" --force

          NOTES="$(awk -v ver="## ${VERSION}" '
            $0 == ver {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md)"
          if [ -z "${NOTES// }" ]; then
            NOTES="Release ${TAG}"
          fi

          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
