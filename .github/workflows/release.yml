# npm trusted publishing (OIDC) — workflow filename must stay release.yml
# (that is what is configured on npmjs.com Trusted Publisher).
# https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
#
# Trusted Publisher fields (exact match, case-sensitive):
#   Organization or user: MadOrkestra
#   Repository:           pattapatta
#   Workflow filename:    release.yml
#   Environment name:     leave EMPTY (this job has no environment:)
#   Allowed actions:      npm publish must be checked (not stage-only)
#
# setup-node + registry-url writes empty _authToken that blocks OIDC
# (ENEEDAUTH / E404). Strip it before publish — npm/documentation#1960.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Create Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${NAME}@${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.changesets.outputs.has-changesets }}" = "true" ]; then
            echo "Pending changesets — Version Packages PR only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${TAG} already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Will publish ${TAG}"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # No `environment:` — Trusted Publisher Environment must be empty too
    permissions:
      id-token: write # Required for OIDC
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Prepare npmrc for OIDC
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "npmrc=${npmrc}"
          if [ -f "${npmrc}" ]; then
            echo "--- before ---"
            cat "${npmrc}"
            sed -i '/_authToken/d' "${npmrc}"
            echo "--- after ---"
            cat "${npmrc}"
          fi
          echo "node=$(node --version) npm=$(npm --version)"

      - name: Probe npm OIDC token exchange
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          # npm exchange: POST, no body, Authorization: Bearer <oidc id_token>
          # https://api-docs.npmjs.com/ + npm/cli lib/utils/oidc.js
          ID_JSON="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H "Accept: application/json; api-version=2.0" \
            -H "Content-Type: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          ID_TOKEN="$(printf '%s' "${ID_JSON}" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).value))")"
          HTTP="$(curl -sS -o /tmp/oidc-exchange.json -w '%{http_code}' \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/pattapatta" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json")"
          echo "OIDC exchange HTTP ${HTTP}"
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('/tmp/oidc-exchange.json','utf8'));
            delete j.token; delete j.access_token; delete j.refresh_token;
            console.log(JSON.stringify(j,null,2));
          "
          if [ "${HTTP}" != "200" ]; then
            echo "::error::OIDC exchange failed. On npmjs.com Trusted Publisher must be exactly: MadOrkestra / pattapatta / release.yml / empty Environment / allow npm publish. Org name is case-sensitive. Delete and recreate the trust config if it was created wrong (it cannot be edited)."
            exit 1
          fi

      - run: npm publish --access public

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/${TAG}" --force

          NOTES="$(awk -v ver="## ${VERSION}" '
            $0 == ver {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md)"
          if [ -z "${NOTES// }" ]; then
            NOTES="Release ${TAG}"
          fi

          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
