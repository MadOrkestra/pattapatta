<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="pattapatta">
	<title>pattapatta</title>
	<defs>
		<pattern
			id="hatch"
			patternUnits="userSpaceOnUse"
			width="22"
			height="22"
			patternTransform="rotate(45 600 315)"
		>
			<line x1="0" y1="0" x2="0" y2="22" stroke="#1c1917" stroke-width="7" />
		</pattern>
	</defs>
	<rect width="1200" height="630" fill="#fafaf9" />
	<circle cx="600" cy="315" r="200" fill="url(#hatch)" />
	<circle cx="600" cy="315" r="200" fill="none" stroke="#1c1917" stroke-width="14" />
</svg>
