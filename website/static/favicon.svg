<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="pattapatta">
	<title>pattapatta</title>
	<defs>
		<pattern
			id="hatch"
			patternUnits="userSpaceOnUse"
			width="3.2"
			height="3.2"
			patternTransform="rotate(45 16 16)"
		>
			<line class="mark" x1="0" y1="0" x2="0" y2="3.2" stroke-width="1.2" />
		</pattern>
		<style>
			.mark {
				stroke: #1c1917;
			}
			@media (prefers-color-scheme: dark) {
				.mark {
					stroke: #fafaf9;
				}
			}
		</style>
	</defs>
	<!-- Transparent canvas; circle filled with continuous 45° hatch -->
	<circle cx="16" cy="16" r="12.5" fill="url(#hatch)" />
	<circle class="mark" cx="16" cy="16" r="12.5" stroke-width="1.75" fill="none" />
</svg>
